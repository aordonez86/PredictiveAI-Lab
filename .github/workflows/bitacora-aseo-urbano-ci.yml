name: Bitácora de Aseo Urbano CI
on:
  push:
    paths: ['bitacora-aseo-urbano/**', '.github/workflows/bitacora-aseo-urbano-ci.yml']
  pull_request:
    paths: ['bitacora-aseo-urbano/**', '.github/workflows/bitacora-aseo-urbano-ci.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitacora-aseo-urbano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python build.py
      - run: git diff --exit-code -- index.html
      - run: node --test tests/model.test.js
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
