name: Andén al Paso checks
on:
  push:
    paths: ['andenalpaso/**', '.github/workflows/andenalpaso-ci.yml']
  pull_request:
    paths: ['andenalpaso/**', '.github/workflows/andenalpaso-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: andenalpaso
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: node --test tests/wait.test.js
